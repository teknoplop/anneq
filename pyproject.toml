[project]
name = "anneq"
version = "0.1.0"
description = "2026 re-run of a 1995 neural-network equaliser project"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "torch>=2.15.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
